name: PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    uses: palasthotel/github-workflows/.github/workflows/wp-plugin-pr.yml@v1
    with:
      slug: additional-authors
      dev-plugin-name: Additional Authors - DEV
      # npm run lint is tsc --noEmit - wp-scripts never checks the types itself
      build-command: npm ci && npm run lint && npm run build
      # public/build is not in the repository - the pipeline builds it. These are
      # what Assets.php enqueues and Blocks.php registers, so a renamed or broken
      # entry point fails here instead of 404ing in wp-admin.
      required-files: |
        build/gutenberg.js
        build/gutenberg.css
        build/gutenberg.asset.php
        build/meta-box.js
        build/meta-box.css
        build/meta-box.asset.php
        build/users-table.js
        build/users-table.asset.php
        build/blocks/ph-aa-author-archive-title/block.json
        build/blocks/ph-aa-author-archive-title/render.php
        build/blocks/ph-aa-author-archive-biography/block.json
        build/blocks/ph-aa-author-archive-biography/render.php
        vendor/autoload.php
